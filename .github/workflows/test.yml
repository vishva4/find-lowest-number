name: Test Find Lowest Number

on:
  push:

  jobs:
    test:
      NAME: Run Application Tests
      runs-on: ubuntu-latest 

      steps:
        -name: Check out repository
         uses: actions/setup-python@v5
         with:
         python-version: '3.x'

         name: Test 1 - Ten numbers 
         run:
            python3 find_lowest_number.py test_data/test1_inputData.txt
  test1_output.txt
          diff test_data/test1_expextedData.txt test1_outputData.txt

      -name: Test 2 - One number
      run:
      python3 find_lowest_number.py test_data/test2_inputData.txt
  test2_output.txt
          diff test_data/test2-expectedData.txt test2_outputData.txt

        -name: Test 3 - Blank file 
          run: 
          python3 find_lowest_number.py test_data/test3_inputData.txt 
  test3_output.txt
        diff test_data/test3_expectedData.txt test3_outputData.txt


         
